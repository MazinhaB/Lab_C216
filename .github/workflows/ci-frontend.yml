name: CI - Frontend

on:
  push:
    branches:
      - projeto-final
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Lint, Testes, Build e E2E
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar lint, testes e build
        run: make frontend-check
      
      - name: Preparar variáveis de ambiente
        run: cp .env.example .env

      - name: Iniciar aplicação completa
        run: docker compose up --build --wait

      - name: Instalar navegador Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Executar teste E2E
        run: make frontend-e2e

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs --tail=80

      - name: Encerrar contêineres
        if: always()
        run: docker compose down

